<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23f5f5f7'/><text x='16' y='24' font-family='sans-serif' font-size='24' font-weight='700' text-anchor='middle' fill='%231d1d1f'>Q</text></svg>" />
    <title>QueueC</title>
    <script>try{if(localStorage.getItem('queuec-theme')==='dark')document.documentElement.classList.add('dark')}catch(_e){}</script>
    <!-- Paint only. Tailwind preflight already owns the box-sizing/margin reset
         inside @layer base — an unlayered `* { margin:0; padding:0 }` here would
         beat @layer utilities and zero every p-*/m-* in the app. Likewise no
         font-family here: an unlayered one outranks the Geist theme font. -->
    <style>
      html, body {
        background: var(--background, #f5f5f7);
        color: var(--foreground, #1d1d1f);
        min-height: 100vh;
      }
      html.dark, html.dark body {
        background: var(--background, #161618);
        color: var(--foreground, #f5f5f7);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
